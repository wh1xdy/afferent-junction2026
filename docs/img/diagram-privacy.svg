<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 548" width="1200" height="548" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0A1424"/><stop offset="1" stop-color="#1B2D4B"/></linearGradient><radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFD58A" stop-opacity=".55"/><stop offset="1" stop-color="#FFD58A" stop-opacity="0"/></radialGradient><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#FFD58A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1200" height="548" rx="28" fill="url(#sky)"/><circle cx="545" cy="305" r="1" fill="#EEF3FF" opacity="0.27"/><circle cx="1012" cy="113" r="1.3" fill="#EEF3FF" opacity="0.28"/><circle cx="732" cy="111" r="1" fill="#EEF3FF" opacity="0.22"/><circle cx="125" cy="434" r="1.3" fill="#EEF3FF" opacity="0.33"/><circle cx="711" cy="220" r="1" fill="#EEF3FF" opacity="0.34"/><circle cx="734" cy="97" r="0.8" fill="#EEF3FF" opacity="0.39"/><circle cx="93" cy="33" r="0.8" fill="#EEF3FF" opacity="0.32"/><circle cx="923" cy="184" r="1.3" fill="#EEF3FF" opacity="0.40"/><circle cx="622" cy="347" r="1" fill="#EEF3FF" opacity="0.12"/><circle cx="119" cy="354" r="1" fill="#EEF3FF" opacity="0.45"/><circle cx="1175" cy="450" r="1.3" fill="#EEF3FF" opacity="0.20"/><circle cx="899" cy="281" r="0.8" fill="#EEF3FF" opacity="0.14"/><circle cx="909" cy="222" r="1" fill="#EEF3FF" opacity="0.25"/><circle cx="1131" cy="454" r="0.8" fill="#EEF3FF" opacity="0.19"/><circle cx="1095" cy="42" r="1" fill="#EEF3FF" opacity="0.44"/><circle cx="481" cy="53" r="1.3" fill="#EEF3FF" opacity="0.19"/><circle cx="803" cy="190" r="1" fill="#EEF3FF" opacity="0.23"/><circle cx="1138" cy="408" r="0.8" fill="#EEF3FF" opacity="0.16"/><circle cx="840" cy="21" r="1" fill="#EEF3FF" opacity="0.38"/><circle cx="226" cy="305" r="1" fill="#EEF3FF" opacity="0.29"/><circle cx="1163" cy="414" r="1" fill="#EEF3FF" opacity="0.33"/><circle cx="155" cy="233" r="0.8" fill="#EEF3FF" opacity="0.12"/><circle cx="1023" cy="520" r="1.3" fill="#EEF3FF" opacity="0.22"/><circle cx="1046" cy="124" r="1" fill="#EEF3FF" opacity="0.45"/><circle cx="718" cy="314" r="0.8" fill="#EEF3FF" opacity="0.45"/><circle cx="267" cy="149" r="1.3" fill="#EEF3FF" opacity="0.23"/><circle cx="364" cy="53" r="0.8" fill="#EEF3FF" opacity="0.19"/><circle cx="758" cy="23" r="1" fill="#EEF3FF" opacity="0.24"/><circle cx="546" cy="512" r="1" fill="#EEF3FF" opacity="0.39"/><circle cx="177" cy="215" r="1.3" fill="#EEF3FF" opacity="0.17"/><circle cx="1074" cy="439" r="0.8" fill="#EEF3FF" opacity="0.36"/><circle cx="204" cy="341" r="1.3" fill="#EEF3FF" opacity="0.18"/><circle cx="1122" cy="472" r="1.3" fill="#EEF3FF" opacity="0.15"/><circle cx="75" cy="71" r="1.3" fill="#EEF3FF" opacity="0.44"/><circle cx="297" cy="380" r="1" fill="#EEF3FF" opacity="0.26"/><circle cx="1070" cy="269" r="1.3" fill="#EEF3FF" opacity="0.18"/><circle cx="856" cy="51" r="0.8" fill="#EEF3FF" opacity="0.28"/><circle cx="778" cy="334" r="0.8" fill="#EEF3FF" opacity="0.21"/><circle cx="1084" cy="121" r="0.8" fill="#EEF3FF" opacity="0.14"/><circle cx="497" cy="144" r="0.8" fill="#EEF3FF" opacity="0.18"/><circle cx="448" cy="311" r="0.8" fill="#EEF3FF" opacity="0.15"/><circle cx="181" cy="248" r="1" fill="#EEF3FF" opacity="0.34"/><circle cx="822" cy="318" r="0.8" fill="#EEF3FF" opacity="0.31"/><circle cx="1091" cy="261" r="1" fill="#EEF3FF" opacity="0.35"/><circle cx="1137" cy="26" r="1.3" fill="#EEF3FF" opacity="0.14"/><circle cx="98" cy="176" r="0.8" fill="#EEF3FF" opacity="0.45"/><circle cx="107" cy="298" r="1.3" fill="#EEF3FF" opacity="0.13"/><circle cx="1106" cy="397" r="0.8" fill="#EEF3FF" opacity="0.38"/><circle cx="1081" cy="197" r="1.3" fill="#EEF3FF" opacity="0.28"/><circle cx="110" cy="459" r="0.8" fill="#EEF3FF" opacity="0.40"/><circle cx="684" cy="339" r="1" fill="#EEF3FF" opacity="0.25"/><circle cx="34" cy="52" r="0.8" fill="#EEF3FF" opacity="0.33"/><circle cx="1172" cy="471" r="1.3" fill="#EEF3FF" opacity="0.23"/><circle cx="1104" cy="375" r="1" fill="#EEF3FF" opacity="0.27"/><circle cx="993" cy="58" r="1.3" fill="#EEF3FF" opacity="0.13"/><circle cx="717" cy="264" r="0.8" fill="#EEF3FF" opacity="0.44"/><circle cx="151" cy="419" r="1.3" fill="#EEF3FF" opacity="0.42"/><circle cx="317" cy="21" r="1" fill="#EEF3FF" opacity="0.17"/><circle cx="730" cy="284" r="1" fill="#EEF3FF" opacity="0.34"/><circle cx="533" cy="477" r="1" fill="#EEF3FF" opacity="0.25"/><text x="56" y="62" font-size="13" font-weight="700" fill="#FFD58A" text-anchor="start" opacity="1" letter-spacing="2">PRIVACY BY DESIGN</text><text x="56" y="100" font-size="30" font-weight="600" fill="#F2EEE6" text-anchor="start" opacity="1" letter-spacing="0">The data lives at home. The patient holds the only key.</text><rect x="56" y="140" width="300" height="290" rx="20" fill="#1E3150" opacity=".85" stroke="#8FC6E0" stroke-opacity=".45" stroke-width="1.5"/><text x="80" y="180" font-size="12" font-weight="700" fill="#8FC6E0" text-anchor="start" opacity="1" letter-spacing="2">ON THE PHONE</text><text x="80" y="212" font-size="19" font-weight="600" fill="#F2EEE6" text-anchor="start" opacity="1" letter-spacing="0">Never leaves the device</text><circle cx="86" cy="256" r="4" fill="#8FC6E0"/><text x="102" y="261" font-size="14" font-weight="400" fill="#9DB9CC" text-anchor="start" opacity="1" letter-spacing="0">Camera frames and face images</text><circle cx="86" cy="312" r="4" fill="#8FC6E0"/><text x="102" y="317" font-size="14" font-weight="400" fill="#9DB9CC" text-anchor="start" opacity="1" letter-spacing="0">Face meshes and raw expressions</text><circle cx="86" cy="368" r="4" fill="#8FC6E0"/><text x="102" y="373" font-size="14" font-weight="400" fill="#9DB9CC" text-anchor="start" opacity="1" letter-spacing="0">Only per-second numbers move on</text><rect x="386" y="140" width="340" height="290" rx="20" fill="#1E3150" opacity=".85" stroke="#FFD58A" stroke-opacity=".45" stroke-width="1.5"/><text x="410" y="180" font-size="12" font-weight="700" fill="#FFD58A" text-anchor="start" opacity="1" letter-spacing="2">AT HOME</text><text x="410" y="212" font-size="19" font-weight="600" fill="#F2EEE6" text-anchor="start" opacity="1" letter-spacing="0">Stays on the home hub</text><circle cx="416" cy="256" r="4" fill="#FFD58A"/><text x="432" y="261" font-size="14" font-weight="400" fill="#9DB9CC" text-anchor="start" opacity="1" letter-spacing="0">Every session, pulse, HRV, breathing</text><circle cx="416" cy="312" r="4" fill="#FFD58A"/><text x="432" y="317" font-size="14" font-weight="400" fill="#9DB9CC" text-anchor="start" opacity="1" letter-spacing="0">Bedroom climate, presence, posture</text><circle cx="416" cy="368" r="4" fill="#FFD58A"/><text x="432" y="373" font-size="14" font-weight="400" fill="#9DB9CC" text-anchor="start" opacity="1" letter-spacing="0">Talk transcripts and personal baselines</text><line x1="726" y1="285.0" x2="864" y2="285.0" stroke="#FFD58A" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#ar)"/><circle cx="806" cy="285.0" r="62" fill="url(#glow)"/><circle cx="806" cy="285.0" r="34" fill="#0E1A2E" stroke="#FFD58A" stroke-width="2.5"/><rect x="794" y="281.0" width="24" height="18" rx="4" fill="#FFD58A"/><path d="M799 281.0v-6a7 7 0 0 1 14 0v6" fill="none" stroke="#FFD58A" stroke-width="3.2"/><text x="806" y="233.0" font-size="13" font-weight="600" fill="#FFD58A" text-anchor="middle" opacity="1" letter-spacing="0">only when the</text><text x="806" y="347.0" font-size="13" font-weight="600" fill="#FFD58A" text-anchor="middle" opacity="1" letter-spacing="0">patient shows</text><text x="806" y="365.0" font-size="13" font-weight="600" fill="#FFD58A" text-anchor="middle" opacity="1" letter-spacing="0">the QR code</text><rect x="884" y="140" width="260" height="290" rx="20" fill="#1E3150" opacity=".85" stroke="#F3A57A" stroke-opacity=".45" stroke-width="1.5"/><text x="908" y="180" font-size="12" font-weight="700" fill="#F3A57A" text-anchor="start" opacity="1" letter-spacing="2">AT THE CLINIC</text><text x="908" y="212" font-size="19" font-weight="600" fill="#F2EEE6" text-anchor="start" opacity="1" letter-spacing="0">A summary, on request</text><circle cx="914" cy="256" r="4" fill="#F3A57A"/><text x="930" y="261" font-size="14" font-weight="400" fill="#9DB9CC" text-anchor="start" opacity="1" letter-spacing="0">Weekly numbers and the</text><text x="930" y="280" font-size="14" font-weight="400" fill="#9DB9CC" text-anchor="start" opacity="1" letter-spacing="0">early-warning index</text><circle cx="914" cy="312" r="4" fill="#F3A57A"/><text x="930" y="317" font-size="14" font-weight="400" fill="#9DB9CC" text-anchor="start" opacity="1" letter-spacing="0">No name, no images, no raw</text><text x="930" y="336" font-size="14" font-weight="400" fill="#9DB9CC" text-anchor="start" opacity="1" letter-spacing="0">traces</text><circle cx="914" cy="368" r="4" fill="#F3A57A"/><text x="930" y="373" font-size="14" font-weight="400" fill="#9DB9CC" text-anchor="start" opacity="1" letter-spacing="0">Link ends after 7 days, or</text><text x="930" y="392" font-size="14" font-weight="400" fill="#9DB9CC" text-anchor="start" opacity="1" letter-spacing="0">when the patient takes it</text><text x="930" y="411" font-size="14" font-weight="400" fill="#9DB9CC" text-anchor="start" opacity="1" letter-spacing="0">back</text><rect x="56" y="456" width="1088" height="56" rx="16" fill="#9DB9CC" opacity=".1"/><text x="80" y="490" font-size="14.5" font-weight="400" fill="#F2EEE6" text-anchor="start" opacity="1" letter-spacing="0">End-to-end encrypted (AES-GCM 256). The relay in the cloud stores ciphertext only: the key sits after the # in the link and never reaches a server.</text></svg>