"11" font-weight="700" fill="#8A8F9C" text-anchor="start" opacity="1" letter-spacing="2">THE BODY SAYS</text><rect x="80.0" y="336" width="93.0" height="30" rx="15" fill="#9DBE8C"/><text x="95.0" y="356" font-size="13" font-weight="700" fill="#0E1A2E" text-anchor="start" opacity="1" letter-spacing="1.5">STEADY</text><text x="80.0" y="398" font-size="24" font-weight="700" fill="#F2EEE6" text-anchor="start" opacity="1" letter-spacing="0">69 bpm</text><text x="190.0" y="398" font-size="14" font-weight="400" fill="#9DB9CC" text-anchor="start" opacity="1" letter-spacing="0">HRV 48 ms  ·  7 breaths/min</text><line x1="80.0" y1="418" x2="378.6666666666667" y2="418" stroke="#9DB9CC" opacity=".18"/><text x="80.0" y="446" font-size="11" font-weight="700" fill="#9DBE8C" text-anchor="start" opacity="1" letter-spacing="2">THE GAME ANSWERS</text><text x="80.0" y="474" font-size="18" font-weight="600" fill="#F2EEE6" text-anchor="start" opacity="1" letter-spacing="0">The usual mix of games</text><text x="80.0" y="498" font-size="13.5" font-weight="400" fill="#9DB9CC" text-anchor="start" opacity="1" letter-spacing="0">Puzzles and playful tasks, at the person's</text><text x="80.0" y="517" font-size="13.5" font-weight="400" fill="#9DB9CC" text-anchor="start" opacity="1" letter-spacing="0">own pace.</text><line x1="405.6666666666667" y1="413.0" x2="423.6666666666667" y2="413.0" stroke="#FFD58A" stroke-width="2" marker-end="url(#ar)"/><rect x="426.6666666666667" y="288" width="346.6666666666667" height="250" rx="20" fill="#1E3150" opacity=".88" stroke="#F3A57A" stroke-opacity=".5" stroke-width="1.5"/><text x="450.6666666666667" y="322" font-size="11" font-weight="700" fill="#8A8F9C" text-anchor="start" opacity="1" letter-spacing="2">THE BODY SAYS</text><rect x="450.6666666666667" y="336" width="114.0" height="30" rx="15" fill="#F3A57A"/><text x="465.6666666666667" y="356" font-size="13" font-weight="700" fill="#0E1A2E" text-anchor="start" opacity="1" letter-spacing="1.5">STRESSED</text><text x="450.6666666666667" y="398" font-size="24" font-weight="700" fill="#F2EEE6" text-anchor="start" opacity="1" letter-spacing="0">97 bpm</text><text x="560.6666666666667" y="398" font-size="14" font-weight="400" fill="#9DB9CC" text-anchor="start" opacity="1" letter-spacing="0">HRV 20 ms  ·  16 breaths/min</text><line x1="450.6666666666667" y1="418" x2="749.3333333333334" y2="418" stroke="#9DB9CC" opacity=".18"/><text x="450.6666666666667" y="446" font-size="11" font-weight="700" fill="#F3A57A" text-anchor="start" opacity="1" letter-spacing="2">THE GAME ANSWERS</text><text x="450.6666666666667" y="474" font-size="18" font-weight="600" fill="#F2EEE6" text-anchor="start" opacity="1" letter-spacing="0">Switches to slow breathing</text><text x="450.6666666666667" y="498" font-size="13.5" font-weight="400" fill="#9DB9CC" text-anchor="start" opacity="1" letter-spacing="0">Calmer games, softer haptics and a guide at</text><text x="450.6666666666667" y="517" font-size="13.5" font-weight="400" fill="#9DB9CC" text-anchor="start" opacity="1" letter-spacing="0">6 breaths a minute.</text><line x1="776.3333333333334" y1="413.0" x2="794.3333333333334" y2="413.0" stroke="#FFD58A" stroke-width="2" marker-end="url(#ar)"/><rect x="797.3333333333334" y="288" width="346.6666666666667" height="250" rx="20" fill="#1E3150" opacity=".88" stroke="#8FC6E0" stroke-opacity=".5" stroke-width="1.5"/><text x="821.3333333333334" y="322" font-size="11" font-weight="700" fill="#8A8F9C" text-anchor="start" opacity="1" letter-spacing="2">THE BODY SAYS</text><rect x="821.3333333333334" y="336" width="114.0" height="30" rx="15" fill="#8FC6E0"/><text x="836.3333333333334" y="356" font-size="13" font-weight="700" fill="#0E1A2E" text-anchor="start" opacity="1" letter-spacing="1.5">SETTLING</text><text x="821.3333333333334" y="398" font-size="24" font-weight="700" fill="#F2EEE6" text-anchor="start" opacity="1" letter-spacing="0">68 bpm</text><text x="931.3333333333334" y="398" font-size="14" font-weight="400" fill="#9DB9CC" text-anchor="start" opacity="1" letter-spacing="0">HRV 48 ms  ·  7 breaths/min</text><line x1="821.3333333333334" y1="418" x2="1120.0" y2="418" stroke="#9DB9CC" opacity=".18"/><text x="821.3333333333334" y="446" font-size="11" font-weight="700" fill="#8FC6E0" text-anchor="start" opacity="1" letter-spacing="2">THE GAME ANSWERS</text><text x="821.3333333333334" y="474" font-size="18" font-weight="600" fill="#F2EEE6" text-anchor="start" opacity="1" letter-spacing="0">The aurora grows, puzzles return</text><text x="821.3333333333334" y="498" font-size="13.5" font-weight="400" fill="#9DB9CC" text-anchor="start" opacity="1" letter-spacing="0">The sky rewards the calm, and the music</text><text x="821.3333333333334" y="517" font-size="13.5" font-weight="400" fill="#9DB9CC" text-anchor="start" opacity="1" letter-spacing="0">slows with the heart.</text><text x="56" y="568" font-size="11" font-weight="700" fill="#FFD58A" text-anchor="start" opacity="1" letter-spacing="2">ALWAYS ON</text><rect x="56.0" y="582" width="260.0" height="82" rx="16" fill="#FFD58A" opacity=".1"/><text x="74.0" y="610" font-size="14.5" font-weight="700" fill="#FFD58A" text-anchor="start" opacity="1" letter-spacing="0">Each heartbeat</text><text x="74.0" y="632" font-size="12.5" font-weight="400" fill="#F2EEE6" text-anchor="start" opacity="1" letter-spacing="0">the fire beats and the phone taps in</text><text x="74.0" y="649" font-size="12.5" font-weight="400" fill="#F2EEE6" text-anchor="start" opacity="1" letter-spacing="0">time</text><rect x="332.0" y="582" width="260.0" height="82" rx="16" fill="#FFD58A" opacity=".1"/><text x="350.0" y="610" font-size="14.5" font-weight="700" fill="#FFD58A" text-anchor="start" opacity="1" letter-spacing="0">Breathing near 6/min</text><text x="350.0" y="632" font-size="12.5" font-weight="400" fill="#F2EEE6" text-anchor="start" opacity="1" letter-spacing="0">the aurora and the glow grow</text><rect x="608.0" y="582" width="260.0" height="82" rx="16" fill="#FFD58A" opacity=".1"/><text x="626.0" y="610" font-size="14.5" font-weight="700" fill="#FFD58A" text-anchor="start" opacity="1" letter-spacing="0">Heart rate</text><text x="626.0" y="632" font-size="12.5" font-weight="400" fill="#F2EEE6" text-anchor="start" opacity="1" letter-spacing="0">sets the music tempo, then leads it</text><text x="626.0" y="649" font-size="12.5" font-weight="400" fill="#F2EEE6" text-anchor="start" opacity="1" letter-spacing="0">down</text><rect x="884.0" y="582" width="260.0" height="82" rx="16" fill="#FFD58A" opacity=".1"/><text x="902.0" y="610" font-size="14.5" font-weight="700" fill="#FFD58A" text-anchor="start" opacity="1" letter-spacing="0">Over the weeks</text><text x="902.0" y="632" font-size="12.5" font-weight="400" fill="#F2EEE6" text-anchor="start" opacity="1" letter-spacing="0">learns which calm game works for you</text><text x="1144" y="694" font-size="12" font-weight="400" fill="#8A8F9C" text-anchor="end" opacity="1" letter-spacing="0">Values from the recorded demo session. Every response is measured against the person's own baseline.</text></svg>