hor="middle" opacity="1" letter-spacing="0">Last TMS session</text><text x="630.0" y="194" font-size="15" font-weight="400" fill="#8A8F9C" text-anchor="middle" opacity="1" letter-spacing="0">no data  ·  no contact  ·  no signal until the next appointment</text><circle cx="1110" cy="210" r="8" fill="#F3A57A"/><text x="1110" y="240" font-size="13" font-weight="600" fill="#F3A57A" text-anchor="end" opacity="1" letter-spacing="0">Follow-up visit:</text><text x="1110" y="258" font-size="13" font-weight="400" fill="#F3A57A" text-anchor="end" opacity="1" letter-spacing="0">the relapse is found late</text><line x1="56" y1="282" x2="1144" y2="282" stroke="#9DB9CC" stroke-width="1" opacity=".15"/><text x="56" y="318" font-size="12" font-weight="700" fill="#FFD58A" text-anchor="start" opacity="1" letter-spacing="2">WITH AFFERENT</text><text x="56" y="342" font-size="14" font-weight="400" fill="#9DB9CC" text-anchor="start" opacity="1" letter-spacing="0">Two minutes every morning. The index is each patient against their own baseline.</text><line x1="150" y1="455" x2="1110" y2="455" stroke="#9DB9CC" stroke-width="1.5" opacity=".35"/><circle cx="150.0" cy="455" r="8.32" fill="url(#glow)" opacity="0.9"/><circle cx="150.0" cy="455" r="2.6" fill="#FFD58A" opacity="0.9"/><circle cx="167.14285714285714" cy="455" r="8.32" fill="url(#glow)" opacity="0.9"/><circle cx="167.14285714285714" cy="455" r="2.6" fill="#FFD58A" opacity="0.9"/><circle cx="184.28571428571428" cy="455" r="8.32" fill="url(#glow)" opacity="0.9"/><circle cx="184.28571428571428" cy="455" r="2.6" fill="#FFD58A" opacity="0.9"/><circle cx="201.42857142857144" cy="455" r="8.32" fill="url(#glow)" opacity="0.9"/><circle cx="201.42857142857144" cy="455" r="2.6" fill="#FFD58A" opacity="0.9"/><circle cx="218.57142857142856" cy="455" r="8.32" fill="url(#glow)" opacity="0.9"/><circle cx="218.57142857142856" cy="455" r="2.6" fill="#FFD58A" opacity="0.9"/><circle cx="235.71428571428572" cy="455" r="8.32" fill="url(#glow)" opacity="0.