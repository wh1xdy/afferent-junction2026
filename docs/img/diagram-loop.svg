<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" width="1200" height="530" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0A1424"/><stop offset="1" stop-color="#1B2D4B"/></linearGradient><radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFD58A" stop-opacity=".55"/><stop offset="1" stop-color="#FFD58A" stop-opacity="0"/></radialGradient><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#FFD58A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1200" height="530" rx="28" fill="url(#sky)"/><circle cx="396" cy="90" r="1.3" fill="#EEF3FF" opacity="0.14"/><circle cx="973" cy="62" r="1.3" fill="#EEF3FF" opacity="0.14"/><circle cx="609" cy="34" r="1" fill="#EEF3FF" opacity="0.26"/><circle cx="299" cy="291" r="0.8" fill="#EEF3FF" opacity="0.39"/><circle cx="164" cy="127" r="1.3" fill="#EEF3FF" opacity="0.31"/><circle cx="92" cy="308" r="0.8" fill="#EEF3FF" opacity="0.44"/><circle cx="74" cy="444" r="1" fill="#EEF3FF" opacity="0.26"/><circle cx="647" cy="300" r="1.3" fill="#EEF3FF" opacity="0.39"/><circle cx="230" cy="306" r="1.3" fill="#EEF3FF" opacity="0.18"/><circle cx="133" cy="371" r="1.3" fill="#EEF3FF" opacity="0.14"/><circle cx="259" cy="355" r="1" fill="#EEF3FF" opacity="0.38"/><circle cx="560" cy="477" r="1" fill="#EEF3FF" opacity="0.22"/><circle cx="941" cy="364" r="0.8" fill="#EEF3FF" opacity="0.15"/><circle cx="368" cy="263" r="1" fill="#EEF3FF" opacity="0.36"/><circle cx="354" cy="505" r="0.8" fill="#EEF3FF" opacity="0.29"/><circle cx="211" cy="186" r="1" fill="#EEF3FF" opacity="0.26"/><circle cx="1136" cy="54" r="1.3" fill="#EEF3FF" opacity="0.31"/><circle cx="1036" cy="172" r="1.3" fill="#EEF3FF" opacity="0.24"/><circle cx="596" cy="413" r="0.8" fill="#EEF3FF" opacity="0.40"/><circle cx="1116" cy="252" r="1.3" fill="#EEF3FF" opacity="0.14"/><circle cx="868" cy="170" r="1.3" fill="#EEF3FF" opacity="0.45"/><circle cx="973" cy="157" r="1" fill="#EEF3FF" opacity="0.41"/><circle cx="423" cy="485" r="1" fill="#EEF3FF" opacity="0.18"/><circle cx="156" cy="44" r="1" fill="#EEF3FF" opacity="0.16"/><circle cx="307" cy="210" r="1" fill="#EEF3FF" opacity="0.15"/><circle cx="541" cy="290" r="0.8" fill="#EEF3FF" opacity="0.39"/><circle cx="1022" cy="154" r="1" fill="#EEF3FF" opacity="0.45"/><circle cx="812" cy="205" r="0.8" fill="#EEF3FF" opacity="0.17"/><circle cx="224" cy="131" r="0.8" fill="#EEF3FF" opacity="0.12"/><circle cx="984" cy="106" r="1" fill="#EEF3FF" opacity="0.12"/><circle cx="506" cy="200" r="1.3" fill="#EEF3FF" opacity="0.23"/><circle cx="166" cy="445" r="1.3" fill="#EEF3FF" opacity="0.34"/><circle cx="878" cy="243" r="1.3" fill="#EEF3FF" opacity="0.38"/><circle cx="475" cy="214" r="0.8" fill="#EEF3FF" opacity="0.28"/><circle cx="485" cy="110" r="0.8" fill="#EEF3FF" opacity="0.27"/><circle cx="148" cy="315" r="0.8" fill="#EEF3FF" opacity="0.12"/><circle cx="195" cy="66" r="1" fill="#EEF3FF" opacity="0.32"/><circle cx="102" cy="119" r="1" fill="#EEF3FF" opacity="0.17"/><circle cx="313" cy="189" r="1" fill="#EEF3FF" opacity="0.28"/><circle cx="154" cy="259" r="1" fill="#EEF3FF" opacity="0.28"/><circle cx="382" cy="87" r="1.3" fill="#EEF3FF" opacity="0.23"/><circle cx="327" cy="429" r="0.8" fill="#EEF3FF" opacity="0.29"/><circle cx="258" cy="491" r="1" fill="#EEF3FF" opacity="0.17"/><circle cx="650" cy="29" r="1.3" fill="#EEF3FF" opacity="0.22"/><circle cx="766" cy="61" r="1" fill="#EEF3FF" opacity="0.29"/><circle cx="1074" cy="193" r="0.8" fill="#EEF3FF" opacity="0.30"/><circle cx="924" cy="180" r="0.8" fill="#EEF3FF" opacity="0.32"/><circle cx="935" cy="394" r="0.8" fill="#EEF3FF" opacity="0.39"/><circle cx="969" cy="385" r="0.8" fill="#EEF3FF" opacity="0.19"/><circle cx="592" cy="381" r="0.8" fill="#EEF3FF" opacity="0.38"/><circle cx="568" cy="112" r="1.3" fill="#EEF3FF" opacity="0.44"/><circle cx="539" cy="484" r="1" fill="#EEF3FF" opacity="0.44"/><circle cx="443" cy="125" r="0.8" fill="#EEF3FF" opacity="0.28"/><circle cx="412" cy="256" r="1.3" fill="#EEF3FF" opacity="0.40"/><circle cx="576" cy="341" r="1.3" fill="#EEF3FF" opacity="0.15"/><circle cx="786" cy="470" r="1.3" fill="#EEF3FF" opacity="0.37"/><circle cx="575" cy="104" r="1.3" fill="#EEF3FF" opacity="0.23"/><circle cx="949" cy="501" r="1" fill="#EEF3FF" opacity="0.27"/><circle cx="882" cy="57" r="0.8" fill="#EEF3FF" opacity="0.18"/><circle cx="167" cy="91" r="1" fill="#EEF3FF" opacity="0.39"/><text x="56" y="62" font-size="13" font-weight="700" fill="#FFD58A" text-anchor="start" opacity="1" letter-spacing="2">HOW IT WORKS</text><text x="56" y="100" font-size="30" font-weight="600" fill="#F2EEE6" text-anchor="start" opacity="1" letter-spacing="0">From a two-minute morning to the right call at the right time</text><rect x="56" y="140" width="196" height="228" rx="20" fill="#1E3150" opacity=".85" stroke="#FFD58A" stroke-opacity=".45" stroke-width="1.5"/><circle cx="90" cy="180" r="19" fill="#FFD58A"/><text x="90" y="187" font-size="19" font-weight="700" fill="#0E1A2E" text-anchor="middle" opacity="1" letter-spacing="0">1</text><text x="74" y="232" font-size="18" font-weight="600" fill="#F2EEE6" text-anchor="start" opacity="1" letter-spacing="0">Kindle the</text><text x="74" y="255" font-size="18" font-weight="600" fill="#F2EEE6" text-anchor="start" opacity="1" letter-spacing="0">lantern</text><text x="74" y="286.0" font-size="13.5" font-weight="400" fill="#9DB9CC" text-anchor="start" opacity="1" letter-spacing="0">A wordless two-minute</text><text x="74" y="305.5" font-size="13.5" font-weight="400" fill="#9DB9CC" text-anchor="start" opacity="1" letter-spacing="0">ritual each morning. No</text><text x="74" y="325.0" font-size="13.5" font-weight="400" fill="#9DB9CC" text-anchor="start" opacity="1" letter-spacing="0">forms, no typing, nothing</text><text x="74" y="344.5" font-size="13.5" font-weight="400" fill="#9DB9CC" text-anchor="start" opacity="1" letter-spacing="0">to fail.</text><line x1="256" y1="180" x2="275" y2="180" stroke="#FFD58A" stroke-width="2" marker-end="url(#ar)"/><rect x="279" y="140" width="196" height="228" rx="20" fill="#1E3150" opacity=".85" stroke="#8FC6E0" stroke-opacity=".45" stroke-width="1.5"/><circle cx="313" cy="180" r="19" fill="#8FC6E0"/><text x="313" y="187" font-size="19" font-weight="700" fill="#0E1A2E" text-anchor="middle" opacity="1" letter-spacing="0">2</text><text x="297" y="232" font-size="18" font-weight="600" fill="#F2EEE6" text-anchor="start" opacity="1" letter-spacing="0">The body speaks</text><text x="297" y="263.0" font-size="13.5" font-weight="400" fill="#9DB9CC" text-anchor="start" opacity="1" letter-spacing="0">Two finger clips and the</text><text x="297" y="282.5" font-size="13.5" font-weight="400" fill="#9DB9CC" text-anchor="start" opacity="1" letter-spacing="0">phone camera read pulse,</text><text x="297" y="302.0" font-size="13.5" font-weight="400" fill="#9DB9CC" text-anchor="start" opacity="1" letter-spacing="0">HRV and breathing.</text><line x1="479" y1="180" x2="498" y2="180" stroke="#FFD58A" stroke-width="2" marker-end="url(#ar)"/><rect x="502" y="140" width="196" height="228" rx="20" fill="#1E3150" opacity=".85" stroke="#9DBE8C" stroke-opacity=".45" stroke-width="1.5"/><circle cx="536" cy="180" r="19" fill="#9DBE8C"/><text x="536" y="187" font-size="19" font-weight="700" fill="#0E1A2E" text-anchor="middle" opacity="1" letter-spacing="0">3</text><text x="520" y="232" font-size="18" font-weight="600" fill="#F2EEE6" text-anchor="start" opacity="1" letter-spacing="0">The game answers</text><text x="520" y="263.0" font-size="13.5" font-weight="400" fill="#9DB9CC" text-anchor="start" opacity="1" letter-spacing="0">Stressed: slow breathing.</text><text x="520" y="282.5" font-size="13.5" font-weight="400" fill="#9DB9CC" text-anchor="start" opacity="1" letter-spacing="0">Tired: a gentle wake-up.</text><text x="520" y="302.0" font-size="13.5" font-weight="400" fill="#9DB9CC" text-anchor="start" opacity="1" letter-spacing="0">Light and music follow</text><text x="520" y="321.5" font-size="13.5" font-weight="400" fill="#9DB9CC" text-anchor="start" opacity="1" letter-spacing="0">the heart.</text><line x1="702" y1="180" x2="721" y2="180" stroke="#FFD58A" stroke-width="2" marker-end="url(#ar)"/><rect x="725" y="140" width="196" height="228" rx="20" fill="#1E3150" opacity=".85" stroke="#9DB9CC" stroke-opacity=".45" stroke-width="1.5"/><circle cx="759" cy="180" r="19" fill="#9DB9CC"/><text x="759" y="187" font-size="19" font-weight="700" fill="#0E1A2E" text-anchor="middle" opacity="1" letter-spacing="0">4</text><text x="743" y="232" font-size="18" font-weight="600" fill="#F2EEE6" text-anchor="start" opacity="1" letter-spacing="0">Home learns your</text><text x="743" y="255" font-size="18" font-weight="600" fill="#F2EEE6" text-anchor="start" opacity="1" letter-spacing="0">normal</text><text x="743" y="286.0" font-size="13.5" font-weight="400" fill="#9DB9CC" text-anchor="start" opacity="1" letter-spacing="0">A small hub at home</text><text x="743" y="305.5" font-size="13.5" font-weight="400" fill="#9DB9CC" text-anchor="start" opacity="1" letter-spacing="0">compares each day with</text><text x="743" y="325.0" font-size="13.5" font-weight="400" fill="#9DB9CC" text-anchor="start" opacity="1" letter-spacing="0">your own first weeks.</text><text x="743" y="344.5" font-size="13.5" font-weight="400" fill="#9DB9CC" text-anchor="start" opacity="1" letter-spacing="0">Nothing leaves.</text><line x1="925" y1="180" x2="944" y2="180" stroke="#FFD58A" stroke-width="2" marker-end="url(#ar)"/><rect x="948" y="140" width="196" height="228" rx="20" fill="#1E3150" opacity=".85" stroke="#F3A57A" stroke-opacity=".45" stroke-width="1.5"/><circle cx="982" cy="180" r="19" fill="#F3A57A"/><text x="982" y="187" font-size="19" font-weight="700" fill="#0E1A2E" text-anchor="middle" opacity="1" letter-spacing="0">5</text><text x="966" y="232" font-size="18" font-weight="600" fill="#F2EEE6" text-anchor="start" opacity="1" letter-spacing="0">You show your</text><text x="966" y="255" font-size="18" font-weight="600" fill="#F2EEE6" text-anchor="start" opacity="1" letter-spacing="0">doctor</text><text x="966" y="286.0" font-size="13.5" font-weight="400" fill="#9DB9CC" text-anchor="start" opacity="1" letter-spacing="0">One QR code, when you</text><text x="966" y="305.5" font-size="13.5" font-weight="400" fill="#9DB9CC" text-anchor="start" opacity="1" letter-spacing="0">decide. The clinic reads</text><text x="966" y="325.0" font-size="13.5" font-weight="400" fill="#9DB9CC" text-anchor="start" opacity="1" letter-spacing="0">an early-warning index,</text><text x="966" y="344.5" font-size="13.5" font-weight="400" fill="#9DB9CC" text-anchor="start" opacity="1" letter-spacing="0">not a data feed.</text><rect x="56.0" y="398" width="532.0" height="92" rx="18" fill="#FFD58A" opacity=".12"/><rect x="56.0" y="398" width="5" height="92" rx="2.5" fill="#FFD58A"/><text x="82.0" y="430" font-size="12" font-weight="700" fill="#FFD58A" text-anchor="start" opacity="1" letter-spacing="2">FOR THE PATIENT</text><text x="82.0" y="454" font-size="15" font-weight="400" fill="#F2EEE6" text-anchor="start" opacity="1" letter-spacing="0">A calm habit that feels like a game, never like a test. Their data</text><text x="82.0" y="475" font-size="15" font-weight="400" fill="#F2EEE6" text-anchor="start" opacity="1" letter-spacing="0">stays theirs.</text><rect x="612.0" y="398" width="532.0" height="92" rx="18" fill="#F3A57A" opacity=".12"/><rect x="612.0" y="398" width="5" height="92" rx="2.5" fill="#F3A57A"/><text x="638.0" y="430" font-size="12" font-weight="700" fill="#F3A57A" text-anchor="start" opacity="1" letter-spacing="2">FOR THE CLINIC</text><text x="638.0" y="454" font-size="15" font-weight="400" fill="#F2EEE6" text-anchor="start" opacity="1" letter-spacing="0">Eight weeks of objective signal between visits, and a clear reason</text><text x="638.0" y="475" font-size="15" font-weight="400" fill="#F2EEE6" text-anchor="start" opacity="1" letter-spacing="0">to call before the relapse.</text></svg>