<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A0E1C">
  <title>Your week</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="design/tokens.css" id="tokens">
  <link rel="stylesheet" href="css/patient.css">
</head>
<body>
  <canvas id="world" aria-hidden="true"></canvas>
  <div id="scrim" aria-hidden="true"></div>

  <header id="top">
    <a class="icon" id="back" href="index.html" aria-label="Back to the lantern">
      <svg viewBox="0 0 24 24"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg>
    </a>
    <span id="sim" class="af-simulated" hidden>Simulated</span>
    <button class="icon" id="talkTop" type="button" aria-label="Talk to someone">
      <svg viewBox="0 0 24 24"><path d="M4.5 5.5h15v10h-9l-6 4z"/></svg>
    </button>
  </header>

  <main id="page" aria-busy="true">
    <section id="today" aria-labelledby="headline">
      <p id="date" class="af-caps"></p>
      <h1 id="headline"></h1>
      <p id="sub"></p>
      <figure id="arcWrap">
        <svg id="arc" viewBox="0 0 340 158" role="img" aria-label="Today's arc"></svg>
        <figcaption id="arcCap"></figcaption>
      </figure>
      <div id="weekBlock" aria-labelledby="weekH">
        <h2 id="weekH" class="af-caps">Your week</h2>
        <div id="week"></div>
      </div>
    </section>

    <section class="block" aria-labelledby="helpH">
      <h2 id="helpH" class="af-caps">What helped</h2>
      <ul id="helped" class="rows"></ul>
    </section>

    <section class="block" aria-labelledby="clinicH">
      <h2 id="clinicH" class="af-caps">Your clinic sees</h2>
      <div id="sharing" class="seg" role="radiogroup" aria-labelledby="clinicH">
        <button type="button" role="radio" data-v="summary">Summary</button>
        <button type="button" role="radio" data-v="nothing_tonight">Not tonight</button>
        <button type="button" role="radio" data-v="paused">Pause 7 days</button>
      </div>
      <ul id="sees" class="sees"></ul>
    </section>

    <section class="block" aria-labelledby="sensH">
      <h2 id="sensH" class="af-caps">Sensors</h2>
      <div id="sensors"></div>
    </section>

    <section class="block">
      <button type="button" id="talkRow" class="talk">
        <span class="glyph"><svg viewBox="0 0 24 24"><path d="M4.5 5.5h15v10h-9l-6 4z"/></svg></span>
        <span class="tl">Talk to someone</span>
        <svg class="chev" viewBox="0 0 24 24"><path d="M9.5 5.5L16 12l-6.5 6.5"/></svg>
      </button>
    </section>

    <footer id="foot"></footer>
  </main>

  <div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="crisisTitle" hidden>
    <div class="sheetBg" data-close></div>
    <div class="sheetCard">
      <span class="grab" aria-hidden="true"></span>
      <h2 id="crisisTitle"></h2>
      <p id="crisisText"></p>
      <div id="contacts"></div>
      <button type="button" class="quiet" data-close>Close</button>
    </div>
  </div>

  <script src="js/util.js"></script>
  <script src="js/art.js"></script>
  <script src="js/world.js"></script>
  <script src="js/patient.js"></script>
</body>
</html>
