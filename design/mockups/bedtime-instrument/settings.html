<!doctype html>
<html lang="en" data-sky="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Settings</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/m3.css">
<style>
  .top-bar { position: sticky; top: 0; background: var(--md-sys-color-surface); z-index: 2; }
  .sec { margin-bottom: 8px; }
  .export { padding: 8px 16px 16px; }
  .hub-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--md-sys-color-tertiary); display: inline-block; margin-right: 6px; vertical-align: 1px; }
  .foot { padding: 24px 32px 40px; display: flex; gap: 12px; align-items: flex-start; }
  .foot .ms { font-size: 20px; }
</style>
</head>
<body>
<div class="safe-top"></div>
<header class="top-bar">
  <a class="icon-btn state" href="start.html" aria-label="Back"><span class="ms">arrow_back</span></a>
  <h1 class="title title-l" style="margin:0">Settings</h1>
</header>

<section class="sec" aria-labelledby="sens">
  <div class="subhead"><h2 id="sens" class="title-s" style="margin:0">Sensors</h2><button class="icon-btn state" aria-label="Only numbers leave the phone, never images or sound"><span class="ms">info</span></button></div>
  <ul class="list group">
    <li><label class="li state"><span class="ms lead">videocam</span><span class="txt"><span class="hl">Phone camera</span></span><span class="switch"><input type="checkbox" checked><span class="track"></span><span class="thumb"><span class="ms">check</span></span></span></label></li>
    <li><label class="li state"><span class="ms lead">ecg_heart</span><span class="txt"><span class="hl">Pulse stone</span></span><span class="switch"><input type="checkbox" checked><span class="track"></span><span class="thumb"><span class="ms">check</span></span></span></label></li>
    <li><label class="li state"><span class="ms lead">lightbulb</span><span class="txt"><span class="hl">Bedside light</span></span><span class="switch"><input type="checkbox" checked><span class="track"></span><span class="thumb"><span class="ms">check</span></span></span></label></li>
    <li><label class="li state"><span class="ms lead">accessibility_new</span><span class="txt"><span class="hl">Bedside camera</span></span><span class="switch"><input type="checkbox"><span class="track"></span><span class="thumb"><span class="ms">check</span></span></span></label></li>
    <li><label class="li state"><span class="ms lead">sensor_occupied</span><span class="txt"><span class="hl">Presence</span></span><span class="switch"><input type="checkbox" checked><span class="track"></span><span class="thumb"><span class="ms">check</span></span></span></label></li>
    <li><label class="li state"><span class="ms lead">mobile_vibrate</span><span class="txt"><span class="hl">Phone movement</span></span><span class="switch"><input type="checkbox" checked><span class="track"></span><span class="thumb"><span class="ms">check</span></span></span></label></li>
  </ul>
</section>

<section class="sec" aria-labelledby="exp">
  <div class="subhead"><h2 id="exp" class="title-s" style="margin:0">Export</h2><button class="icon-btn state" aria-label="Your clinic gets data only when it is exported from your hub. Nobody watches live."><span class="ms">info</span></button></div>
  <div class="export">
    <div class="seg" role="radiogroup" aria-labelledby="exp">
      <button class="state" role="radio" aria-checked="true"><span class="ms">check</span>Summary</button>
      <button class="state" role="radio" aria-checked="false">Skip today</button>
      <button class="state" role="radio" aria-checked="false">Pause 7 d</button>
    </div>
  </div>
  <ul class="list group">
    <li><a class="li two state" href="#hub"><span class="ms lead">router</span><span class="txt"><span class="hl">Hub</span><span class="sup num"><span class="hub-dot"></span>192.168.1.20:8000</span></span><span class="trail"><span class="ms">chevron_right</span></span></a></li>
  </ul>
</section>

<section class="sec" aria-labelledby="night">
  <div class="subhead"><h2 id="night" class="title-s" style="margin:0">Night</h2></div>
  <ul class="list group">
    <li><label class="li state"><span class="ms lead">volume_up</span><span class="txt"><span class="hl">Sound</span></span><span class="switch"><input type="checkbox" checked><span class="track"></span><span class="thumb"><span class="ms">check</span></span></span></label></li>
    <li><label class="li state"><span class="ms lead">dark_mode</span><span class="txt"><span class="hl">Quiet night</span></span><span class="switch"><input type="checkbox" checked><span class="track"></span><span class="thumb"><span class="ms">check</span></span></span></label></li>
    <li><label class="li state"><span class="ms lead">edit_note</span><span class="txt"><span class="hl">Check-in</span></span><span class="switch"><input type="checkbox" checked><span class="track"></span><span class="thumb"><span class="ms">check</span></span></span></label></li>
    <li><label class="li state"><span class="ms lead">motion_photos_off</span><span class="txt"><span class="hl">Reduce motion</span></span><span class="switch"><input type="checkbox"><span class="track"></span><span class="thumb"><span class="ms">check</span></span></span></label></li>
  </ul>
</section>

<div class="foot muted body-s"><span class="ms">lock</span><span>Kept on your home hub. Camera images never leave the phone.</span></div>
</body>
</html>
