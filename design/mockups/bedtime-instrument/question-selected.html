<!doctype html>
<html lang="en" data-sky="dawn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Check-in, answered</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/m3.css">
<link rel="stylesheet" href="css/question.css">
</head>
<body>
<main class="q">
  <div class="safe-top"></div>
  <header class="q-bar">
    <button class="icon-btn state" aria-label="Previous question"><span class="ms">arrow_back</span></button>
    <div class="steps" role="progressbar" aria-valuemin="1" aria-valuemax="3" aria-valuenow="2" aria-label="Question 2 of 3"><i class="done"></i><i class="on"></i><i></i></div>
    <button class="icon-btn state" aria-label="Answer for the last 7 days. Tap one; the next question follows."><span class="ms">info</span></button>
  </header>
  <section class="q-body">
    <p class="when label-l"><span class="ms">calendar_today</span>Last 7 days</p>
    <h1 class="q-text headline-m">Feeling down, depressed or hopeless</h1>
  </section>
  <div class="answers" role="radiogroup" aria-label="How often">
    <button class="ans state" role="radio" aria-checked="false"><span class="freq" aria-hidden="true"><i></i><i></i><i></i></span><span class="body-l">Not at all</span></button>
    <button class="ans state" role="radio" aria-checked="true"><span class="freq" aria-hidden="true"><i class="f"></i><i></i><i></i></span><span class="body-l">Several days</span><span class="ms check">check</span></button>
    <button class="ans state" role="radio" aria-checked="false"><span class="freq" aria-hidden="true"><i class="f"></i><i class="f"></i><i></i></span><span class="body-l">More than half the days</span></button>
    <button class="ans state" role="radio" aria-checked="false"><span class="freq" aria-hidden="true"><i class="f"></i><i class="f"></i><i class="f"></i></span><span class="body-l">Nearly every day</span></button>
  </div>
</main>
</body>
</html>
