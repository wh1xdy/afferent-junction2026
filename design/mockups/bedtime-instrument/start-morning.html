<!doctype html>
<html lang="en" data-sky="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Start, morning</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/m3.css">
<style>
  .world { position: absolute; inset: -96px 0 auto 0; height: 844px; background: url("img/sky-night-phone.jpg") center top / cover no-repeat; }
  .scrim { position: absolute; inset: 0; background:
      linear-gradient(to bottom, color-mix(in srgb, var(--md-sys-color-surface) 55%, transparent) 0, transparent 150px),
      linear-gradient(to top, var(--md-sys-color-surface-container-lowest) 0, var(--md-sys-color-surface-container-lowest) 120px, transparent 330px); }
  .ui { position: relative; z-index: 1; height: 100vh; display: flex; flex-direction: column; }
  .bar { display: flex; align-items: center; padding: 0 8px; height: 64px; gap: 4px; }
  .bar .sp { flex: 1; }
  .privacy { height: 24px; padding: 0 8px 0 6px; border-radius: var(--md-shape-full); background: var(--md-sys-color-tertiary-container); color: var(--md-sys-color-on-tertiary-container); display: inline-flex; align-items: center; gap: 4px; margin-right: 4px; }
  .privacy .ms { font-size: 16px; }
  .clock { text-align: center; margin-top: 28px; color: var(--md-sys-color-on-surface); opacity: 0.9; }
  .date { text-align: center; color: var(--md-sys-color-on-surface-variant); margin-top: 4px; }
  .grow { flex: 1; }
  .act { display: flex; flex-direction: column; align-items: center; gap: 12px; padding-bottom: 28px; }
  .cwrap { display: flex; justify-content: center; margin-top: 28px; }
  .checkin { height: 48px; }
</style>
</head>
<body>
<div class="phone">
  <div class="world" aria-hidden="true"></div>
  <div class="scrim" aria-hidden="true"></div>
  <div class="ui">
    <div class="safe-top"></div>
    <div class="bar">
      <button class="icon-btn state" aria-label="Talk to someone"><span class="ms">support</span></button>
      <span class="sp"></span>
            <a class="icon-btn state" href="patient.html" aria-label="Your week"><span class="ms">view_week</span></a>
      <a class="icon-btn state" href="settings.html" aria-label="Settings"><span class="ms">settings</span></a>
    </div>
    <div class="clock display-xl num">07:32</div>
    <div class="date label-l">Sat 14 Nov</div>
    <div class="cwrap"><a class="btn tonal small checkin state" href="question.html"><span class="ms">edit_note</span>Check-in<span class="badge-dot"></span></a></div>
    <div class="grow"></div>
    <div class="act">
      <button class="lantern-btn state" aria-label="Begin"><span data-lantern="#FFF3DC" data-glow="1"></span></button>
      <button class="btn text state">Not today</button>
    </div>
  </div>
</div>
<script src="js/ui.js"></script>
</body>
</html>
