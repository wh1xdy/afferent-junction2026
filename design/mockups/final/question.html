<!doctype html>
<html lang="en" data-sky="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Question</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../gui-tokens.css">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/m3.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<main class="phone q-screen" id="screen" aria-live="polite">
  <div class="safe-top"></div>
  <p class="q-stem title-m" id="stem"></p>
  <h1 class="q-item" id="item"></h1>
  <div class="grow"></div>
  <div class="answers" id="answers" role="radiogroup" aria-labelledby="item"></div>
  <span class="edge-hint" aria-hidden="true"></span>
</main>
<script src="js/questions.js"></script>
<script src="js/ui.js"></script>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  const set = SETS[q.get('set') || 'phq9'];
  const idx = Math.max(1, Math.min(set.items.length, Number(q.get('q') || 1))) - 1;
  const it = set.items[idx];
  const stem = it.header ?? set.stem;
  document.getElementById('stem').textContent = stem || '';
  document.getElementById('stem').hidden = !stem;
  const item = document.getElementById('item');
  item.textContent = it.text;
  item.className = 'q-item ' + (it.text.length > 230 ? 'body-l' : it.text.length > 120 ? 'title-l' : 'headline-m');
  if (it.text.length > 230) item.style.fontSize = '17px';
  const box = document.getElementById('answers');
  set.options.forEach((o, i) => {
    const b = document.createElement('button');
    b.className = 'answer state';
    b.setAttribute('role', 'radio');
    b.setAttribute('aria-checked', String(q.get('sel') === String(i)));
    b.setAttribute('aria-label', o.aria);
    b.innerHTML = (set.dots ? `<span class="freq" aria-hidden="true">${[1, 2, 3].map(n => `<i class="${n <= o.v ? 'on' : ''}"></i>`).join('')}</span>` : '') + `<span>${o.label}</span><span class="ms tick" aria-hidden="true">check</span>`;
    box.appendChild(b);
  });
  let t;
  box.addEventListener('click', e => {
    const b = e.target.closest('.answer');
    if (!b) return;
    const v = [...box.children].indexOf(b);
    clearTimeout(t);
    t = setTimeout(() => { location.href = set.next(idx + 1, set.options[v].v, q); }, 600);
  });
})();
</script>
</body>
</html>
