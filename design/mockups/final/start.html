<!doctype html>
<html lang="en" data-sky="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Start</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../gui-tokens.css">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/m3.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="phone">
  <div class="world night" id="world" aria-hidden="true"></div>
  <div class="scrim-start" aria-hidden="true"></div>
  <div class="ui">
    <div class="safe-top"></div>
    <div class="bar">
      <a class="icon-btn state" href="crisis.html?v=talk" aria-label="Talk to someone"><span class="ms">chat_bubble</span></a>
      <span class="sp"></span>
      <a class="privacy hit state" href="settings.html" aria-label="Camera on. Open sensors" data-show="cam"><span class="ms fill">videocam</span></a>
      <a class="icon-btn state" href="info.html" aria-label="How it works"><span class="ms">info</span></a>
      <a class="icon-btn state" href="patient.html" aria-label="Your week"><span data-lantern=""></span></a>
      <a class="icon-btn state" href="settings.html" aria-label="Settings"><span class="ms">settings</span></a>
    </div>
    <div class="grow"></div>
    <div class="dock">
      <a class="chip lit state" href="checkin-intro.html" data-show="checkin"><span class="dot"></span><span>Check-in</span></a>
      <div class="first">
        <button class="lantern-btn state" aria-label="Begin"><span data-lantern="flame" data-glow="1"></span></button>
        <span class="begin-label title-m" data-show="first">Begin</span>
      </div>
      <button class="btn text state" id="decline">Not tonight</button>
    </div>
  </div>
</div>
<script src="js/ui.js"></script>
<script>
  const s = document.documentElement.dataset.sky;
  document.getElementById('world').className = 'world ' + (s === 'dawn' || s === 'day' ? 'dawn' : s === 'aurora' ? 'aurora' : 'night');
  if (s === 'dawn' || s === 'day') document.getElementById('decline').textContent = 'Not today';
</script>
</body>
</html>
