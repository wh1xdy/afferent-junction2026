<!doctype html>
<html lang="en" data-scheme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C0D1C">
<title>Check-in question</title>
<link rel="stylesheet" href="lp.css">
<style>
  body {
    background:
      radial-gradient(90% 46% at 50% 104%, color-mix(in srgb, var(--md-sys-color-primary) 9%, transparent), transparent 70%),
      var(--md-sys-color-surface-container-lowest);
  }
  .phone { min-height: 100dvh; }
  .top-bar { justify-content: space-between; }
  .top-bar .grow { display: flex; justify-content: center; }
  .spacer48 { width: 48px; }
  .q { padding: 56px 28px 0; display: flex; flex-direction: column; gap: 16px; }
  .stem { color: var(--md-sys-color-on-surface-variant); display: inline-flex; align-items: center; gap: 8px; }
  .prompt { color: var(--md-sys-color-on-surface); text-wrap: balance; }
  .opts { margin-top: auto; padding: 0 16px 32px; display: flex; flex-direction: column; gap: 4px; }
  .opt {
    min-height: 72px; border: 0; padding: 0 24px; display: flex; align-items: center; gap: 12px; text-align: left;
    background: var(--md-sys-color-surface-container); color: var(--md-sys-color-on-surface);
    border-radius: var(--md-sys-shape-corner-small);
    transition: border-radius var(--md-sys-motion-duration-default-spatial) var(--md-sys-motion-spring-default-spatial), background-color 400ms var(--md-sys-motion-easing-standard), box-shadow 600ms var(--md-sys-motion-easing-standard);
    --bloom: var(--lp-flame);
  }
  .opt:first-child { border-top-left-radius: var(--md-sys-shape-corner-extra-large); border-top-right-radius: var(--md-sys-shape-corner-extra-large); }
  .opt:last-child { border-bottom-left-radius: var(--md-sys-shape-corner-extra-large); border-bottom-right-radius: var(--md-sys-shape-corner-extra-large); }
  .opt .txt { flex: 1; }
  .opt .ms { opacity: 0; color: var(--md-sys-color-on-primary-container); font-variation-settings: "FILL" 1, "wght" 500; }
  .opt[aria-checked="true"] {
    border-radius: var(--md-sys-shape-corner-extra-large);
    background: radial-gradient(120% 160% at 50% 130%, color-mix(in srgb, var(--md-sys-color-primary) 40%, var(--md-sys-color-primary-container)) 0%, var(--md-sys-color-primary-container) 65%);
    color: var(--md-sys-color-on-primary-container);
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--md-sys-color-primary) 40%, transparent), 0 0 32px -4px color-mix(in srgb, var(--md-sys-color-primary) 45%, transparent);
  }
  .opt[aria-checked="true"] .ms { opacity: 1; }
</style>
</head>
<body>
<main class="phone">
  <header class="top-bar">
    <a class="icon-btn sl" href="start.html" aria-label="Later"><span class="c"><span class="ms i-close"></span></span></a>
    <div class="grow"><div data-wavy="0.33" data-w="120" style="width:120px" role="progressbar" aria-valuemin="1" aria-valuemax="3" aria-valuenow="1" aria-label="Question 1 of 3"></div></div>
    <span class="spacer48"></span>
  </header>

  <section class="q" aria-labelledby="prompt">
    <p class="stem label-l"><span class="ms s18 i-calendar-month"></span><span id="stem"></span></p>
    <h1 id="prompt" class="prompt headline-m"></h1>
  </section>

  <div class="opts" role="radiogroup" aria-labelledby="prompt" id="opts"></div>
</main>
<script>
  const item = { stem: 'Last 7 days', prompt: 'Little interest or pleasure in doing things', options: ['Not at all', 'Several days', 'More than half the days', 'Nearly every day'] };
  document.getElementById('stem').textContent = item.stem;
  document.getElementById('prompt').textContent = item.prompt;
  const sel = new URLSearchParams(location.search).get('sel');
  document.getElementById('opts').innerHTML = item.options.map((o, i) =>
    `<button class="opt sl" role="radio" aria-checked="${String(sel === String(i))}"><span class="txt body-l">${o}</span><span class="ms i-check"></span></button>`).join('');
</script>
<script src="lp.js"></script>
</body>
</html>
