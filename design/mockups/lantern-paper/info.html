<!doctype html>
<html lang="en" data-scheme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111220">
<title>How it works</title>
<link rel="stylesheet" href="lp.css">
<style>
  .content { padding: 8px 16px 40px; }
  .li { min-height: 80px; gap: 16px; }
  .li .lead-c { width: 48px; height: 48px; border-radius: var(--lp-shape-lantern); background: var(--md-sys-color-surface-container-highest); color: var(--md-sys-color-primary); }
  .li .lead-c .ms { font-variation-settings: "FILL" 1, "wght" 400; }
  .note { display: flex; gap: 12px; align-items: flex-start; padding: 24px 16px 0; color: var(--md-sys-color-on-surface-variant); }
</style>
</head>
<body>
<main class="phone">
  <header class="top-bar">
    <a class="icon-btn sl" href="settings.html" aria-label="Close"><span class="c"><span class="ms i-close"></span></span></a>
    <h1 class="title title-l grow">How it works</h1>
  </header>
  <div class="content">
    <div class="list-group">
      <div class="li"><span class="lead-c"><span class="ms i-light"></span></span><span class="txt body-l">Pick the lantern that fits today</span></div>
      <div class="li"><span class="lead-c"><span class="ms i-touch-app"></span></span><span class="txt body-l">Tap when the lantern flares</span></div>
      <div class="li"><span class="lead-c"><span class="ms i-swipe"></span></span><span class="txt body-l">Tap, drag or swipe in the panel</span></div>
      <div class="li"><span class="lead-c"><span class="ms i-alt-route"></span></span><span class="txt body-l">The climb gives more glow</span></div>
      <div class="li"><span class="lead-c"><span class="ms i-air"></span></span><span class="txt body-l">Hold to breathe in, let go to breathe out</span></div>
    </div>
    <p class="note body-m"><span class="ms s20 i-lock"></span><span>Only numbers leave the phone, never images. They stay on your home hub until the export.</span></p>
  </div>
</main>
<script src="lp.js"></script>
</body>
</html>
