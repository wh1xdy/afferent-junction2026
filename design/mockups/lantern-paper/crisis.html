<!doctype html>
<html lang="en" data-scheme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111220">
<title>Talk to someone</title>
<link rel="stylesheet" href="lp.css">
<style>
  body { background: radial-gradient(80% 40% at 50% 0%, color-mix(in srgb, var(--md-sys-color-primary) 10%, transparent), transparent 70%), var(--md-sys-color-surface); }
  .content { padding: 16px 16px 32px; display: flex; flex-direction: column; flex: 1; }
  .mark { width: 72px; height: 72px; margin: 8px 12px 24px; border-radius: var(--lp-shape-lantern); display: grid; place-items: center;
    background: radial-gradient(100% 120% at 50% 110%, color-mix(in srgb, var(--md-sys-color-primary) 45%, var(--md-sys-color-primary-container)), var(--md-sys-color-primary-container) 70%);
    color: var(--md-sys-color-on-primary-container); box-shadow: 0 0 40px -6px color-mix(in srgb, var(--md-sys-color-primary) 50%, transparent); }
  .lead { padding: 0 12px 32px; text-wrap: balance; }
  .li { min-height: 80px; padding-right: 8px; }
  .li .txt .num { font-variant-numeric: tabular-nums; }
  .li .call > .c { width: 56px; height: 56px; }
  .li .call { width: 56px; height: 56px; }
  .li.first .call > .c { background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); }
  .foot { margin-top: auto; padding: 24px 12px 0; color: var(--md-sys-color-on-surface-variant); display: flex; gap: 12px; }
</style>
</head>
<body>
<main class="phone">
  <header class="top-bar">
    <a class="icon-btn sl" href="start.html" aria-label="Close"><span class="c"><span class="ms i-close"></span></span></a>
  </header>
  <div class="content">
    <div class="mark" aria-hidden="true"><span class="ms s36 fill i-support"></span></div>
    <h1 class="lead headline-m">If today is heavy, you do not have to carry it alone.</h1>
    <div class="list-group">
      <a class="li first sl" href="tel:0925250111"><span class="txt"><span class="title-m">MIELI Crisis Helpline</span><span class="sup num">24 h · 09 2525 0111</span></span><span class="icon-btn call"><span class="c"><span class="ms fill i-call"></span></span></span></a>
      <a class="li sl" href="tel:0900000000"><span class="txt"><span class="title-m">Your clinic</span><span class="sup num">09 000 0000</span></span><span class="icon-btn tonal call"><span class="c"><span class="ms fill i-call"></span></span></span></a>
      <a class="li sl" href="tel:112"><span class="txt"><span class="title-m">Emergency</span><span class="sup num">112</span></span><span class="icon-btn tonal call"><span class="c"><span class="ms fill i-emergency"></span></span></span></a>
    </div>
    <p class="foot body-m"><span class="ms s20 i-info"></span><span>Afferent is not an emergency service and nobody watches it live. Your clinic reads the export on working days.</span></p>
  </div>
</main>
<script src="lp.js"></script>
</body>
</html>
