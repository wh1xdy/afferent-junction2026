<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f131c">
<title>Afferent settings</title>
<link rel="stylesheet" href="m3.css">
<link rel="stylesheet" href="scheme.css">
<link rel="stylesheet" href="app.css">
<style>
  body { background: var(--md-sys-color-surface); }
  .page { padding: 0 16px 32px; }
  .large-title { padding: 24px 16px 8px; }
  .seg-item { flex-direction: column; align-items: stretch; gap: 12px; min-height: 0; padding: 16px; }
  .dev, .tip { display: none; }
  .show-tip .tip { display: flex; }
  .show-dev .dev { display: block; }
  .item .val { font: var(--md-sys-typescale-body-medium); color: var(--md-sys-color-on-surface-variant); }
  .status { display: inline-flex; align-items: center; gap: 6px; }
  .status i { width: 8px; height: 8px; border-radius: 50%; background: var(--md-custom-color-stable); }
  .tip {
    margin: 4px 16px 0; padding: 12px 16px; border-radius: var(--md-sys-shape-corner-large);
    background: var(--md-sys-color-surface-container-highest); color: var(--md-sys-color-on-surface);
    font: var(--md-sys-typescale-body-medium); display: flex; gap: 12px; align-items: flex-start;
  }
  .tip .ms { color: var(--md-sys-color-on-surface-variant); font-size: 20px; }
</style>
</head>
<body class="sky-night">
<header class="top-bar">
  <a class="icon-btn state" href="start.html" aria-label="Back"><span class="ms">arrow_back</span></a>
</header>
<main class="page">
  <h1 class="headline-medium large-title">Settings</h1>

  <h2 class="section-label">Sensors <button class="icon-btn state" aria-label="About sensors" aria-expanded="false" onclick="document.body.classList.toggle('show-tip')"><span class="ms s20">info</span></button></h2>
  <p class="tip" role="note"><span class="ms">lock</span>Only numbers leave the phone. Never images or sound.</p>
  <div class="group" style="margin-top:12px">
    <label class="item state"><span class="lead"><span class="ms">visibility</span></span><span class="txt"><span class="t">Phone camera</span><span class="s">Eyes, head tilt</span></span><span class="switch"><input type="checkbox" checked><span class="track"></span><span class="thumb"><span class="ms">check</span></span></span></label>
    <label class="item state"><span class="lead"><span class="ms">monitor_heart</span></span><span class="txt"><span class="t">Pulse stone</span></span><span class="switch"><input type="checkbox" checked><span class="track"></span><span class="thumb"><span class="ms">check</span></span></span></label>
    <label class="item state"><span class="lead"><span class="ms">light</span></span><span class="txt"><span class="t">Bedside light</span></span><span class="switch"><input type="checkbox" checked><span class="track"></span><span class="thumb"><span class="ms">check</span></span></span></label>
    <label class="item state"><span class="lead"><span class="ms">videocam_off</span></span><span class="txt"><span class="t">Bedside camera</span><span class="s">Stick figure only</span></span><span class="switch"><input type="checkbox"><span class="track"></span><span class="thumb"><span class="ms">check</span></span></span></label>
    <label class="item state"><span class="lead"><span class="ms">sensors</span></span><span class="txt"><span class="t">Presence</span></span><span class="switch"><input type="checkbox" checked><span class="track"></span><span class="thumb"><span class="ms">check</span></span></span></label>
    <label class="item state"><span class="lead"><span class="ms">screen_rotation</span></span><span class="txt"><span class="t">Phone movement</span></span><span class="switch"><input type="checkbox" checked><span class="track"></span><span class="thumb"><span class="ms">check</span></span></span></label>
  </div>

  <h2 class="section-label">Export to clinic <button class="icon-btn state" aria-label="About the export"><span class="ms s20">info</span></button></h2>
  <div class="group">
    <div class="item seg-item">
      <div class="seg" role="radiogroup" aria-label="Next export">
        <button role="radio" aria-checked="true"><span class="ms s18">check</span>Summary</button>
        <button role="radio" aria-checked="false"><span class="ms s18">check</span>Skip today</button>
        <button role="radio" aria-checked="false"><span class="ms s18">check</span>Pause 7 d</button>
      </div>
    </div>
    <a class="item state" href="#"><span class="lead"><span class="ms">router</span></span><span class="txt"><span class="t">Hub</span><span class="s status"><i></i>192.168.1.20:8000</span></span><span class="ms trail">chevron_right</span></a>
  </div>

  <h2 class="section-label">Comfort</h2>
  <div class="group">
    <label class="item state"><span class="lead"><span class="ms">volume_up</span></span><span class="txt"><span class="t">Sound</span></span><span class="switch"><input type="checkbox" checked><span class="track"></span><span class="thumb"><span class="ms">check</span></span></span></label>
    <label class="item state"><span class="lead"><span class="ms">dark_mode</span></span><span class="txt"><span class="t">Quiet night</span><span class="s">Light at most 25%</span></span><span class="switch"><input type="checkbox" checked><span class="track"></span><span class="thumb"><span class="ms">check</span></span></span></label>
    <label class="item state"><span class="lead"><span class="ms">motion_photos_off</span></span><span class="txt"><span class="t">Reduced motion</span></span><span class="switch"><input type="checkbox"><span class="track"></span><span class="thumb"><span class="ms">check</span></span></span></label>
    <label class="item state"><span class="lead"><span class="ms">edit_note</span></span><span class="txt"><span class="t">Check-in</span><span class="s">Weekly</span></span><span class="switch"><input type="checkbox" checked><span class="track"></span><span class="thumb"><span class="ms">check</span></span></span></label>
  </div>

  <section class="dev">
    <h2 class="section-label"><span class="ms s20">code</span>&nbsp;Developer</h2>
    <div class="group">
      <label class="item state"><span class="lead"><span class="ms">science</span></span><span class="txt"><span class="t">Simulated sensors</span></span><span class="sim">SIMULATED</span><span class="switch"><input type="checkbox" checked><span class="track"></span><span class="thumb"><span class="ms">check</span></span></span></label>
      <a class="item one state" href="#"><span class="lead plain"><span class="ms">touch_app</span></span><span class="txt"><span class="t">Input</span></span><span class="val">Touch</span></a>
      <a class="item one state" href="#"><span class="lead plain"><span class="ms">schedule</span></span><span class="txt"><span class="t">Clock</span></span><span class="val">Morning</span></a>
      <a class="item one state" href="#"><span class="lead plain"><span class="ms">history</span></span><span class="txt"><span class="t">Session</span></span><span class="val">Full</span></a>
      <a class="item one state" href="#"><span class="lead plain"><span class="ms">person</span></span><span class="txt"><span class="t">Day profile</span></span><span class="val">Live</span></a>
    </div>
  </section>
</main>
<script>if (new URLSearchParams(location.search).get('dev') === '1') document.body.classList.add('show-dev', 'show-tip');</script>
</body>
</html>
