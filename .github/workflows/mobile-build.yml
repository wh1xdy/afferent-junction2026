name: Mobile build

# Runs on PRs into main (catches breaks before merge), on merge (= push to main) and on demand.
on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "android/**"
      - "demo/**"
      - "design/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - ".github/workflows/mobile-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "ios/**"
      - "android/**"
      - "demo/**"
      - "design/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - ".github/workflows/mobile-build.yml"
  workflow_dispatch:

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (Capacitor, debug APK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JS dependencies
        run: npm ci

      - name: Sync web assets into the Android project
        run: |
          npm run design
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: afferent-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  ios-capacitor:
    name: iOS (Capacitor app)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Sync web assets into the iOS project
        run: |
          npm run design
          npx cap sync ios

      # No signing secrets in CI: build for the simulator to check the app compiles.
      - name: Build (simulator, unsigned)
        run: |
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

  ios-native:
    name: iOS (native Afferent app)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Build (simulator, unsigned)
        run: |
          xcodebuild build \
            -project ios/Afferent.xcodeproj \
            -scheme Afferent \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO
